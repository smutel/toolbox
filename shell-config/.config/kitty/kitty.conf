#
# Fonts
#
font_family      Meslo LG M Regular
italic_font      auto
bold_font        auto
bold_italic_font auto
font_size        13.0
font_size_delta  2
box_drawing_scale 0.001, 1, 1.5, 2

#
# Text cursor customization
#
cursor                     #93a1a1
cursor_shape               block
cursor_blink_interval      0.0
cursor_stop_blinking_after 15.0

#
# Scrollback
#
scrollback_lines 10000
scrollback_pager less +G -R
scrollback_in_new_tab no

#
# Mouse
#
wheel_scroll_multiplier 5.0
click_interval 0.5
select_by_word_characters :@-./_~?&=%+#
mouse_hide_wait 3.0
focus_follows_mouse no

#
# Performance tuning
#
repaint_delay    10
input_delay 3

#
# Terminal bell
#
enable_audio_bell    no
visual_bell_duration 0.0

#
# Window layout
#
enabled_layouts *
remember_window_size   no
initial_window_width   640
initial_window_height  400
window_border_width 1
window_margin_width 0
window_padding_width 0
active_border_color #00ff00
inactive_border_color #cccccc
inactive_text_alpha 1.0

#
# Tab bar
#
tab_bar_min_tabs 1
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title.rsplit("/")[-1]} ({index})"
active_tab_foreground #000000
active_tab_background #268bd2
active_tab_font_style bold
inactive_tab_foreground #7c838f
inactive_tab_background #073642
inactive_tab_font_style normal
tab_separator " ┇ "
tab_bar_style powerline

#
# Color scheme
#
foreground           #839496
background           #002b36
selection_foreground #002b36
selection_background #586e75
color0               #073642
color8               #002b36
color1               #dc322f
color9               #cb4b16
color2               #859900
color10              #586e75
color3               #b58900
color11              #657b83
color4               #268bd2
color12              #839496
color5               #d33682
color13              #6c71c4
color6               #2aa198
color14              #93a1a1
color7               #eee8d5
color15              #fdf6e3

#
# Keyboard shortcuts
#

## Window management
map alt+down next_window
map alt+up previous_window

## Tab management
map ctrl+x>c new_tab
map ctrl+x>n next_tab
map ctrl+x>p previous_tab
map ctrl+x>x close_tab
map ctrl+x>, set_tab_title
map ctrl+x>1 goto_tab 1
map ctrl+x>2 goto_tab 2
map ctrl+x>3 goto_tab 3
map ctrl+x>4 goto_tab 4
map ctrl+x>5 goto_tab 5
map ctrl+x>6 goto_tab 6
map ctrl+x>7 goto_tab 7
map ctrl+x>8 goto_tab 8
map ctrl+x>9 goto_tab 9

## Layout management
map ctrl+x>" launch --cwd=current --location=hsplit
map ctrl+x>% launch --cwd=current --location=vsplit
map ctrl+x>right resize_window narrower 2
map ctrl+x>left resize_window wider 2
map ctrl+x>up resize_window taller 2
map ctrl+x>down resize_window shorter 2
